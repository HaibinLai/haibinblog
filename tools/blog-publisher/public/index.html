<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haibin Blog Publisher</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main class="shell">
  <header><div><p class="eyebrow">HAIBIN'S BLOG · LOCAL WRITER</p><h1>发布新文章</h1><p class="muted">在本地写作、预览和保存；确认无误后再推送到 GitHub。</p></div><div class="header-tools"><span class="local-pill">● 仅本机可访问</span><a href="https://haibinblog-private.haibinlai.workers.dev" target="_blank">打开私人空间 ↗</a></div></header>
  <div class="notice"><strong>发布前提示</strong><span>不勾选推送时只保存到本地仓库；勾选后会提交并推送公开文章和图片。</span></div>
  <form id="post-form">
    <section class="card"><h2>文章信息</h2><div class="grid two">
      <label>标题<input name="title" required placeholder="例如：Large Scale Machine Learning"></label>
      <label>文件名（可选）<input name="slug" placeholder="large-scale-machine-learning"></label>
      <label>发布日期<input name="publishedAt" type="date" required></label>
      <label>更新日期<input name="updatedAt" type="date"></label>
      <label>简介<textarea name="description" rows="2" placeholder="显示在首页和搜索结果中"></textarea></label>
      <label>分类<input name="category" value="Research" placeholder="Research"></label>
      <label>标签<input name="tags" placeholder="systems, notes, research"></label>
      <label>其他分类<input name="categories" placeholder="例如：CPP, OS"></label>
    </div></section>
    <section class="card"><h2>语言和首页</h2><div class="grid two">
      <label>语言<select name="language"><option value="">未指定</option><option value="zh-CN">中文</option><option value="en">English</option></select></label>
      <label>双语关联 ID<input name="translationKey" placeholder="两种语言填写同一个值"></label>
      <label>首页精选位置<select name="featuredRank"><option value="">不精选</option><option value="1">1 · 主卡片</option><option value="2">2 · 右上</option><option value="3">3 · 右下</option></select></label>
      <label>精选标题<input name="featuredTitle" placeholder="可选的短标题"></label>
      <label>精选标签<input name="featuredLabel" placeholder="Research / Travel"></label>
      <label class="check"><input name="showCitation" type="checkbox" checked> 显示引用信息</label>
    </div></section>
    <section class="card"><div class="section-heading"><h2>正文</h2><div class="editor-tabs"><button type="button" class="tab is-active" data-tab="write">写作</button><button type="button" class="tab" data-tab="preview">预览</button></div></div><div class="markdown-toolbar" aria-label="Markdown 工具栏"><button type="button" data-insert="## ">H2</button><button type="button" data-insert="**粗体**">粗体</button><button type="button" data-insert="*斜体*">斜体</button><button type="button" data-insert="- ">列表</button><button type="button" data-insert="> ">引用</button><button type="button" data-insert="```\n\n```">代码</button><button type="button" data-insert="| A | B |\n|---|---|\n| 1 | 2 |">表格</button><button type="button" data-insert="{{UPLOADED_IMAGE}}">插入图片</button></div><label class="editor-label">支持 Markdown、公式、表格和图片链接<textarea id="body" name="body" class="editor" required placeholder="# 文章标题\n\n在这里写正文……\n\n| A | B |\n|---|---|\n| 1 | 2 |"></textarea></label><div id="preview" class="markdown-preview" hidden></div><div class="editor-footer"><span id="body-count">0 字</span><span id="save-state">未保存到本地</span></div></section>
    <section class="card"><h2>图片</h2><div class="grid two"><label>封面图片 URL<input id="card-image" name="cardImage" type="url" placeholder="https://.../image.png"></label><label>精选横幅 URL（可选）<input name="featuredImage" type="url" placeholder="不填则使用封面图"></label><label>上传封面或正文图片<input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"></label><label>图片月份<input name="imageMonth" type="month"></label></div><div class="image-drop" id="image-drop">也可以把图片拖到这里；正文中点击“插入图片”会在保存后替换成实际地址。</div><div class="image-preview-wrap" hidden><img id="image-preview" alt="图片预览"><span id="image-name"></span></div><p id="image-status" class="muted">可以直接粘贴 S3、腾讯云或其他 HTTPS 图片地址；本地上传仍会保存到 image-backend。</p></section>
    <section class="actions"><label class="check"><input name="draft" type="checkbox"> 保存为草稿</label><label class="check"><input name="push" type="checkbox"> 保存后提交并推送到 GitHub</label><button type="button" class="secondary" id="clear-draft">清除本地自动保存</button><button type="submit" id="save-button">保存文章</button></section>
  </form>
  <div id="result" class="result" hidden></div>
</main><script src="/app.js"></script>
</body></html>
